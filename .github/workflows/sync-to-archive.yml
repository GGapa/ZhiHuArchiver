name: Sync to ZhiHuArchive

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZhiHuArchiver
        uses: actions/checkout@v4
        with:
          path: archiver

      - name: Checkout ZhiHuArchive
        uses: actions/checkout@v4
        with:
          repository: GGapa/ZhiHuArchive
          token: ${{ secrets.SYNC_TOKEN }}
          path: archive

      - name: Sync files
        run: |
          # 同步所有 .py 文件
          rsync -av --include='*/' --include='*.py' --exclude='*' \
            archiver/ archive/
          
          # 同步 build-and-deploy.yml
          mkdir -p archive/.github/workflows
          cp archiver/.github/workflows/build-and-deploy.yml \
             archive/.github/workflows/build-and-deploy.yml

          cp archiver/.env.example \
             archive/.env.example

      - name: Commit and push
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b sync-test
          git add -A
          git diff --staged --quiet || git commit -m "Sync from ZhiHuArchiver @ ${{ github.sha }}"
          git push origin sync-test
